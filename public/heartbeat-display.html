<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HeartBeat Display</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Consolas, "Courier New", monospace;
      }

      body {
        display: grid;
        place-items: stretch;
      }

      #screen {
        width: 100vw;
        height: 100vh;
        display: block;
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.14), transparent 24%),
          linear-gradient(180deg, #060b18 0%, #000 100%);
      }
    </style>
  </head>
  <body>
    <canvas id="screen" aria-label="Heartbeat fullscreen display"></canvas>
    <script src="./heartbeat-display.js"></script>
  </body>
</html>
